# ===== GENERAL =====
spring.application.name=mdexo-backend
# spring.profiles.active=dev

# ===== SERVER =====
server.port=8080
server.tomcat.max-swallow-size=${SERVER_TOMCAT_MAX_SWALLOW_SIZE:50MB}

# ===== MVC =====
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
spring.web.locale=de_DE
spring.web.locale-resolver=fixed

# ===== MULTIPART =====
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}

# ===== DATABASE
spring.datasource.url=${DB_URL}  # Use environment variable for database URL
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool (default in Spring Boot 3)
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# JPA
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ===== LIQUIBASE =====
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

# ===== CACHE =====
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=app_cache

# ===== EMAIL =====
resend.api-key=${RESEND_API_KEY:test-key}
app.email.enabled=true
app.email.from-address=${EMAIL_FROM_ADDRESS:noreply@iterials.com}
app.email.admin-email=${EMAIL_ADMIN:admin@iterials.com}
app.email.support-email=${EMAIL_SUPPORT:support@iterials.com}

# ===== THYMELEAF =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.check-template-location=true
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true
spring.thymeleaf.excluded-view-names=*.html,*.ico,*.js,*.css,*.json,*.map,*.txt,*.xml

# ===== STATIC RESOURCES =====
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=3600

# ===== UPLOAD =====
app.s3.folder=real-estates
app.upload.max-size=${MAX_UPLOAD_SIZE:52428800}
app.upload.allowed-mime-types=${ALLOWED_MIME_TYPES:image/jpeg,image/png}
app.upload.allowed-extensions=${ALLOWED_EXTENSIONS:jpg,jpeg,png}

# ===== AWS/S3 =====
aws.cloudfront.domain=https://d6oif2udj7x1l.cloudfront.net
aws.cloudfront.enabled=true
app.s3.cleanup.enabled=true
app.s3.cleanup.dry-run=${S3_CLEANUP_DRY_RUN:true}

# ===== SCHEDULING =====
spring.task.scheduling.pool.size=2

# ===== CORS =====
cors.allowed-origins=https://dwellia.rs,https://www.dwellia.rs,https://api.dwellia.rs,http://localhost:5173,http://localhost:3000

# ===== TESTING =====
app.testing.enabled=false
app.testing.cleanup-before-tests=true
app.testing.stop-on-failure=false

# ===== ANALYTICS & WARNINGS =====
app.warnings.enabled=true
app.warnings.check-interval=3600000
app.warnings.email-notifications=true
app.warnings.thresholds.listing-critical=90
app.warnings.thresholds.listing-warning=75
app.warnings.thresholds.agent-inactive-days=30
app.warnings.thresholds.trial-expiring-critical=3
app.warnings.thresholds.trial-expiring-warning=7
app.analytics.retention-days=90
app.analytics.cache-enabled=true
app.analytics.cache-duration=300

# ===== LOGGING =====
logging.level.org.springframework.security=${LOG_LEVEL_SPRING_SECURITY:DEBUG}
spring.profiles.active=dev
